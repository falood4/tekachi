# Load repo-root .env (KEY=VALUE lines) as a properties file.
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8080}
spring.datasource.url=${TEKACHI_DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${TEKACHI_DB_USERNAME}
spring.datasource.password=${TEKACHI_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=245f99ebadb01b0dd4a7be0546098deaf89a9a12101745c140c27013edf3fb92
jwt.expiration=600000
jwt.rfrsh.expiration=86400000

openrouter.api.key=${OPENROUTER_API_KEY}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
